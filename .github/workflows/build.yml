name: Kontakt Android CI

on:
  push:
    branches: [main, master, fix/security-ci-release, work/visible-kontakt-ui]
    tags: ['v*']
  pull_request:
    branches: [main, master, work/visible-kontakt-ui, fix/security-ci-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Report VK ID configuration
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        run: |
          if [ -z "$VK_CLIENT_ID" ]; then
            echo "::warning title=VK ID is not configured::Set the repository variable VK_CLIENT_ID."
          fi
          if [ -z "$VK_CLIENT_SECRET" ]; then
            echo "::warning title=VK ID secret is missing::VK ID login cannot be tested until the credential configuration is complete."
          fi

      - name: Run Android Lint and unit tests
        working-directory: android
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Build debug APK for testing only
        working-directory: android
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks assembleDebug

      - name: Verify merged manifest has the VK ID client ID placeholder
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -path '*merged_manifests/debug*AndroidManifest.xml' -print -quit)
          fi
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            echo "::error::Merged debug manifest was not generated."
            exit 1
          fi
          if ! grep -q 'VKIDClientID' "$MANIFEST"; then
            echo "::error::Merged manifest does not contain VKIDClientID. Do not distribute this APK."
            exit 1
          fi
          echo "Merged manifest contains VKIDClientID."

      - name: Upload debug APK (testing artifact, not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Kontakt-debug-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Build signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require release signing credentials
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEY_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Release signing is not configured::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Build signed release APK
        working-directory: android
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-build-cache assembleRelease

      - name: Verify APK is signed
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kontakt-signed-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: Kontakt-signed-release
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kontakt ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
