name: Build Kontakt APK

on:
  push:
    branches: [main, master, fix/vk-id-build-config]
    tags: ['v*']
  pull_request:
    branches: [main, master, fix/vk-id-build-config]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Найти исходники Android
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/settings.gradle.kts ] || [ -f android/settings.gradle ]; then
            DIR="android"
            echo "Используются отслеживаемые исходники: $DIR"
          else
            mkdir -p _src
            unzip -q -o kontakt-project-fixed-repository.zip -d _src
            SETTINGS=$(find _src \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
            if [ -z "$SETTINGS" ]; then
              echo "Не найден файл настроек Gradle"
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
            echo "Исходники пока берутся из ZIP: $DIR"
          fi
          if [ ! -f "$DIR/gradlew" ]; then
            echo "Не найден gradlew: $DIR/gradlew"
            exit 1
          fi
          if [ ! -f "$DIR/app/build.gradle.kts" ] && [ ! -f "$DIR/app/build.gradle" ]; then
            echo "Не найден Gradle build-файл Android-модуля app в $DIR"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Запустить unit-тесты
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Собрать APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Kontakt-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачать APK сборки
        uses: actions/download-artifact@v4
        with:
          name: Kontakt-debug-apk
          path: dist/

      - name: Опубликовать постоянный GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kontakt ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
