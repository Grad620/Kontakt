name: Kontakt Android CI

on:
  push:
    branches: [main, master, fix/security-ci-release, work/visible-kontakt-ui, design/style-system]
    tags: ['v*']
  pull_request:
    branches: [main, master, work/visible-kontakt-ui, fix/security-ci-release, design/style-system]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch and event, while keeping push builds
# separate from PR checks so a PR cannot cancel the APK-producing push run.
concurrency:
  group: kontakt-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate VK ID configuration
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID || secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VK_CLIENT_ID}" ]]; then
            echo "::warning title=VK ID is not configured::VK_CLIENT_ID is missing. The APK can be built for UI testing, but VK ID login cannot be verified."
          elif [[ ! "${VK_CLIENT_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid VK ID configuration::VK_CLIENT_ID must contain only digits. Its value is not printed."
            exit 1
          else
            echo "VK_CLIENT_ID is present and has numeric format."
          fi
          if [[ -z "${VK_CLIENT_SECRET}" ]]; then
            echo "::warning title=VK ID secret is missing::VK_CLIENT_SECRET is not configured. Check the VK ID SDK setup before testing login."
          else
            echo "VK_CLIENT_SECRET is present; its value is not printed."
          fi

      - name: Run Android Lint and unit tests
        working-directory: android
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID || secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
          VK_STANDALONE_APP_ID: ${{ secrets.VK_STANDALONE_APP_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Build debug APK for testing only
        working-directory: android
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID || secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
          VK_STANDALONE_APP_ID: ${{ secrets.VK_STANDALONE_APP_ID }}
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks assembleDebug

      - name: Verify resolved VK ID manifest values
        working-directory: android
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID || secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=$(find app/build/intermediates -path '*merged_manifests/debug*AndroidManifest.xml' -print -quit)
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            echo "::error::Merged debug manifest was not generated."
            exit 1
          fi
          if grep -Fq '${VKIDClientID}' "$MANIFEST" || grep -Fq '${VKIDClientSecret}' "$MANIFEST"; then
            echo "::error::Unresolved VK ID manifest placeholder."
            exit 1
          fi
          if [ -n "$VK_CLIENT_ID" ]; then
            if [[ ! "$VK_CLIENT_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::VK_CLIENT_ID must contain only digits. Its value is not printed."
              exit 1
            fi
            if ! grep -Fq "$VK_CLIENT_ID" "$MANIFEST"; then
              echo "::error::Configured VK_CLIENT_ID is absent from merged manifest. Do not distribute this APK."
              exit 1
            fi
            echo "Merged manifest contains the configured VK ID."
          else
            echo "::warning title=VK ID is not configured::APK is suitable for UI testing only; VK ID sign-in is disabled."
          fi
          if [ -z "$VK_CLIENT_SECRET" ]; then
            echo "::warning title=VK ID secret is missing::VK ID sign-in is disabled until VK_CLIENT_SECRET is configured."
          else
            echo "VK_CLIENT_SECRET is present; its value is not printed."
          fi

      - name: Verify protected key is not embedded in BuildConfig source
        working-directory: android
        env:
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VK_CLIENT_SECRET" ]; then
            echo "VK_CLIENT_SECRET is not configured; skipping BuildConfig exposure check."
            exit 0
          fi
          if [ -d app/build/generated/source/buildConfig ]; then
            if grep -R -F -q -- "$VK_CLIENT_SECRET" app/build/generated/source/buildConfig; then
              echo "::error title=Potential credential exposure::VK_CLIENT_SECRET was found in generated BuildConfig source."
              exit 1
            fi
          fi
          echo "Protected key was not found in generated BuildConfig source."
 
      - name: Upload debug APK (testing artifact, not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Kontakt-debug-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error

  release:
    name: Build signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require release signing credentials
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEY_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Release signing is not configured::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Build signed release APK
        working-directory: android
        env:
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID || secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
          VK_STANDALONE_APP_ID: ${{ secrets.VK_STANDALONE_APP_ID }}
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-build-cache assembleRelease

      - name: Verify APK is signed
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kontakt-signed-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: Kontakt-signed-release
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kontakt ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
