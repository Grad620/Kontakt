name: Build Kontakt APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Путь «только телефон»: если в репозиторий загружен архив kontakt-project.zip
      # (или старое имя vg-project.zip), он распаковывается и собирается.
      # Иначе собирается сам репозиторий.
      - name: Найти проект
        id: loc
        run: |
          ZIP=""
          if [ -f kontakt-project.zip ]; then ZIP=kontakt-project.zip; fi
          if [ -z "$ZIP" ] && [ -f vg-project.zip ]; then ZIP=vg-project.zip; fi
          if [ -n "$ZIP" ]; then
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            echo "dir=$(dirname "$(find _src -name settings.gradle.kts -print -quit)")" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 1. Сначала сборка APK: даже если потом упадёт какой-то тест, готовый APK не пропадёт.
      - name: Сборка debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kontakt-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      # 2. Потом тесты. Если они упадут, шаг будет красным: это честный сигнал, что что-то не так.
      - name: Модульные тесты
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_SCOPES: ${{ vars.VK_SCOPES }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Отчёт о тестах (если были ошибки)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kontakt-test-report
          path: ${{ steps.loc.outputs.dir }}/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
